<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>svg.draggable.js — demo</title>
    <style>
      :root {
        --bg: #111418;
        --panel: #1a1f26;
        --accent: #4da3ff;
        --text: #e6e6e6;
        --muted: #8a93a3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid #262b33;
        font-size: 14px;
      }
      header b {
        color: var(--accent);
      }
      header span {
        color: var(--muted);
      }
      main {
        flex: 1;
        padding: 20px;
      }
      .stage {
        background: var(--panel);
        border: 1px solid #262b33;
        border-radius: 8px;
        padding: 12px;
      }
      footer {
        padding: 10px 20px;
        border-top: 1px solid #262b33;
        font-size: 13px;
        color: var(--muted);
      }
      footer b {
        color: var(--text);
      }
    </style>
  </head>

  <body>
    <header>
      <b>svg.draggable.js</b>
      <span>— drag the shapes: plain, grouped, constrained and nested</span>
    </header>

    <main>
      <div class="stage">
        <svg id="scene" width="100%" height="420"></svg>
      </div>
    </main>

    <footer>
      <span id="status">ready</span>
    </footer>

    <script type="module" src="/main.js"></script>
  </body>
</html>
